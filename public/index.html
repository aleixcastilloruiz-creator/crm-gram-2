<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUREQO — Panel</title>
  <link rel="icon" href="/assets/logo.png" />
  <script>
    // Modo oscuro: se aplica ANTES de pintar para evitar el parpadeo blanco.
    try { if (localStorage.getItem("lureqo_theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
  </script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <div class="mobile-topbar">
    <button id="mobileNavToggle" class="mobile-nav-toggle" type="button" aria-label="Abrir menú">☰</button>
    <img src="/assets/logo.png" alt="" />
    <span class="mobile-topbar-title">LUREQO</span>
  </div>
  <div id="mobileNavBackdrop" class="mobile-nav-backdrop"></div>

  <div class="shell">
    <aside class="sidebar">
      <div class="brand" data-tooltip="LUREQO">
        <img src="/assets/logo.png" alt="LUREQO" />
        <div class="brand-text">
          <div class="brand-title">LUREQO</div>
          <div class="brand-title">CRM</div>
        </div>
      </div>
      <nav id="sidenav"></nav>
    </aside>

    <div class="workspace">
      <div class="reenviador-layout">
        <aside class="account-list" id="accountList"></aside>
        <div class="resize-handle" id="accountListResizer" title="Arrastra para cambiar el ancho"></div>
        <main id="app"></main>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
